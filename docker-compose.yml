name: secure-file-storage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_file_storage
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_file_storage"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    # Note: local MinIO exposes ETag via its default CORS policy (verified),
    # so multipart uploads work without extra configuration here.
    # For production S3 buckets apply docker/s3-bucket-cors-production.xml
    # (PutBucketCors) so browsers can read part ETags.
    entrypoint: |
      /bin/sh -c '
      mc alias set local http://storage:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/secure-files
      '

volumes:
  db_data:
  storage_data: